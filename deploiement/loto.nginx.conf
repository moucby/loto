# Site Nginx de l'appli Loto (fichiers statiques, pas de base de données).
# Remplacer DOMAINE par le nom de domaine, puis activer le HTTPS avec :
#   sudo certbot --nginx -d DOMAINE
server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    root /var/www/loto;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Polices et bibliothèques (Tesseract, PeerJS) : elles ne changent pas.
    # (eng.traineddata.gz est décompressé par l'appli : servi tel quel, sans Content-Encoding)
    location ~* ^/(fonts|vendor)/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Manifeste de l'appli installable
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Page, scripts, styles et service worker : toujours revalidés, pour que les
    # téléphones reçoivent les mises à jour (le cache hors ligne est géré par sw.js)
    location ~* (^/$|\.html$|\.js$|\.css$) {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
}
